<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты поиска | Хвостик</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class = "page">
        <header class = "head">
            <div class = "header">  
                <span class = "frst_row">
                    <div class = "logo_box">
                        <div class = "label">
                            <header class = "cmp_name">
                                Хвостик
                            </header>
                            <object class = "logo" data="icons/logo.svg" type="image/svg+xml" class="icon"></object>
                        </div>
                    </div>
                    <span class = "main_info">
                        <p class = "mains">
                            Ваш город: Москва
                        </p>
                        <p class = "mains">
                            8 800 57 09 90
                        </p>
                    </span>
                    <object class = "icons_img" data="icons/profile.svg" type="image/svg+xml" class="icon"></object>
                    <object class = "icons_img" data="icons/basket.svg" type="image/svg+xml" class="icon"></object>
                </span>
                <span class = "second_row">
                    <button class="catalogue_button" id="catalog-btn">каталог</button>
                    <search>
                        <form id="search-form">  
                            <input class = "search" id="search-input">
                            <button class = "find_btn" type="submit">найти</button>
                        </form>
                    </search>
                </span>
                <nav class = "menu">
                    <button class = "sections_button">собаки</button>
                    <button class = "sections_button">кошки</button>
                    <button class = "sections_button">грызуны</button>
                    <button class = "sections_button">ветаптека</button>
                    <button class = "sections_button">новости</button>
                </nav>
            </div>
        </header>
        <div class = "main_body">
            <div class = "main_material_section">
                <!-- Измените этот заголовок -->
                <div class = "banner_text"><span id="results-title">Найдено</span></div>
                
                <!-- Очистите этот контейнер, он будет заполнен JavaScript -->
                <section class = "products_section" id="products-container">
                    <!-- JavaScript удалит статические карточки и добавит динамические -->
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="./scripts/page-3.js"></script>
</body>
</html>
